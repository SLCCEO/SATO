services:
  - type: web
    name: sato-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://satoaccord.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://satoaccord.com,https://www.satoaccord.com
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: worker
    name: sato-discord-bot
    runtime: python
    rootDir: discord_bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://satoaccord.com
      - key: SATO_CADET_ROLE
        value: Cadet
      - key: PYTHON_VERSION
        value: 3.11.9
